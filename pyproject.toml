[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gha-cache-auditor"
version = "0.1.0"
description = "Conservative static analysis of GitHub Actions cache invalidation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
gha-cache-audit = "gha_cache_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.16.8,<0.16.9",
]
