name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.18'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync gha-cache-audit . --format sarif > cache-audit.sarif
  action-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: audit
        uses: ./
        with:
          path: tests/fixtures/safe.yml
          format: sarif
      - name: Verify clean report
        shell: bash
        env:
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
        run: |
          test -s "$AUDIT_REPORT"
          python -c 'import json,sys; run=json.load(open(sys.argv[1], encoding="utf-8"))["runs"][0]; assert not run["results"] and run["invocations"][0]["executionSuccessful"]' "$AUDIT_REPORT"
