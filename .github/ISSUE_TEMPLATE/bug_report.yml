name: Bug report
description: Report an incorrect result or a failure in the auditor.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: auditor-version
    attributes:
      label: GHA Cache Auditor version
      placeholder: 0.1.5
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: 3.13
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Minimal workflow example
      description: Remove secrets and unrelated steps. Include a small workflow that reproduces the issue.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant output and diagnostics. Redact tokens and private data.
    validations:
      required: true
